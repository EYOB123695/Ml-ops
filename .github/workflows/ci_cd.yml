name: GNN MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test_and_gate:
    name: Run Unit Tests and Model Promotion Gate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Test Suite (13 Automated Tests)
      run: |
        pytest tests/ -v

    - name: Evaluate Validation Promotion Gate
      run: |
        python -m src.pipeline.validation_gate \
          --candidate-dir models/latest \
          --champion-dir models/champion
